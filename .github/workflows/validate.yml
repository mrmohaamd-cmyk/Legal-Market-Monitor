name: Validate site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build

  reddit-prototype:
    name: Check disabled Reddit prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: reddit-bot/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: reddit-bot
      - run: npm run check
        working-directory: reddit-bot
