name: Prepare verified opportunity refresh

on:
  schedule:
    # Multiple opportunities to prepare review within the 7-day (168-hour) evidence window.
    # GitHub schedules are best effort and may still be delayed or skipped.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-opportunity-refresh
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'mrmohaamd-cmyk/Legal-Market-Monitor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the checker and current feed
        run: |
          node --test
          npm run build
      - name: Prepare the fixed review-only candidate from fresh official evidence
        run: node scripts/review-candidate.mjs dist/opportunities.json "$RUNNER_TEMP/review-candidate"
      - name: Renew only the fixed candidate artifact on the unchanged main revision
        env:
          SOURCE_CANDIDATE_DIRECTORY: ${{ runner.temp }}/review-candidate
        run: node scripts/publish-review-candidate.mjs
      - name: Preserve candidate source evidence and positive write receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/review-candidate/
          retention-days: 7
          if-no-files-found: warn
      - name: Check first-party source evidence
        run: node scripts/reverify-opportunities.mjs dist/opportunities.json "$RUNNER_TEMP/source-check"
      - name: Install pinned browsers for source and site checks
        run: |
          npm install --prefix "$RUNNER_TEMP/monitor-qa" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/monitor-qa/node_modules/.bin/playwright" install --with-deps chromium webkit > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/browser-install.log"; exit 1; }
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/monitor-qa/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Verify the three reviewed employers and prepare pending bilingual samples
        run: node scripts/check-source-coverage.mjs "$RUNNER_TEMP/source-coverage"
      - name: Renew only the nonpublishing coverage artifact
        env:
          SOURCE_COVERAGE_DIRECTORY: ${{ runner.temp }}/source-coverage
          SOURCE_CANDIDATE_DIRECTORY: ${{ runner.temp }}/review-candidate
        run: node scripts/publish-source-coverage.mjs
      - name: Preserve source coverage and write receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/source-coverage/
          retention-days: 7
          if-no-files-found: warn
      - name: Independently verify structured owner job candidates
        run: node scripts/check-owner-jobs.mjs "$RUNNER_TEMP/owner-jobs"
      - name: Renew only the nonpublishing owner job evidence feed
        env:
          OWNER_JOB_DIRECTORY: ${{ runner.temp }}/owner-jobs
          SOURCE_COVERAGE_DIRECTORY: ${{ runner.temp }}/source-coverage
        run: node scripts/publish-owner-jobs.mjs
      - name: Preserve owner job evidence and positive write receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-job-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/owner-jobs/
          retention-days: 7
          if-no-files-found: warn
      - name: Validate the proposed feed and browser journeys before changing a branch
        run: |
          cp "$RUNNER_TEMP/source-check/proposed-opportunities.json" dist/opportunities.json
          npm run build
          node scripts/browser-check.mjs
      - name: Preserve check and proposed feed even if PR creation is unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/source-check/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve proposed-feed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-refresh-browser-${{ github.run_id }}
          path: browser-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Create or update the single draft review PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CHECK_DIRECTORY: ${{ runner.temp }}/source-check
        run: node scripts/propose-refresh.mjs
      - name: Explain review and publication boundary
        if: always()
        run: |
          echo 'The fixed review-only candidate is renewed only after unchanged first-party evidence is rechecked; publication remains false and accepted remains empty.' >> "$GITHUB_STEP_SUMMARY"
          echo 'General feed changes still prepare a draft PR only. No automatic merge, Pages deployment or Reddit publication occurs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the source evidence and merge only after authorization. The 7-day (168-hour) rule continues to expire records independently.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If creating PRs with GITHUB_TOKEN is disabled in repository Actions settings, the proposed feed remains in the source-refresh artifact. No additional credential is created.' >> "$GITHUB_STEP_SUMMARY"
