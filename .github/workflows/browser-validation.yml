name: Verify browser journeys

on:
  pull_request:
    paths:
      - 'dist/**'
      - 'scripts/browser-check.mjs'
      - '.github/workflows/browser-validation.yml'
  workflow_run:
    workflows: [Deploy independent site]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/monitor-qa" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/monitor-qa/node_modules/.bin/playwright" install --with-deps chromium webkit > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/browser-install.log"; exit 1; }
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/monitor-qa/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Verify local repository-subpath journeys
        run: node scripts/browser-check.mjs
      - name: Verify deployed browser journeys
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          AUDIT_URL: https://mrmohaamd-cmyk.github.io/Legal-Market-Monitor/
        run: node scripts/browser-check.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: browser-results/
          retention-days: 7
          if-no-files-found: ignore
