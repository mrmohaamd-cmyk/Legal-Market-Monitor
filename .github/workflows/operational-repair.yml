name: Prepare and exercise operational repair
on:
  push:
    branches: [fix/operational-handoff-20260930]
    paths: [scripts/repair-operational-gaps.mjs]
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/operational-handoff-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operational-handoff-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/monitor-qa" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/monitor-qa/node_modules/.bin/playwright" install --with-deps chromium webkit
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/monitor-qa/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Observe unmodified browser baseline
        env:
          EXPECT_BASELINE: '1'
        run: node scripts/browser-check.mjs
      - name: Apply reviewed source changes
        run: node scripts/repair-operational-gaps.mjs
      - run: npm run build
      - name: Verify repaired browser journeys
        run: node scripts/browser-check.mjs
      - name: Commit only tested source and validator changes
        run: |
          git add dist/app.js dist/style.css validate.mjs
          git config user.name 'legal-market-monitor[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair subpath styling and sharing; preserve dated access to overdue records'
          git push origin HEAD:fix/operational-handoff-20260930
